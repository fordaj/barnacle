name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-formatting:
    name: Check Formatting (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, labels: [self-hosted, macOS] }
          - { os: Windows, labels: [self-hosted, Windows] }
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # uv for the Python side (black, formattington via uv run). uv also
      # fetches CPython 3.14 on first use.
      - uses: astral-sh/setup-uv@v7

      # node + npm for the PATH-only formatter CLIs (prettier).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # prettier (npm) — matches the PATH-only requirement in format.bash.
      - name: Install prettier
        shell: bash
        run: npm install --global prettier

      # taplo + shfmt — pinned releases, installed into a scratch bin dir.
      # Windows x64 and macOS x64/arm64 only (Linux runners are out of scope
      # for now).
      - name: Install taplo and shfmt
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/fmt-bin"
          mkdir -p "$bin_dir"
          case "$(uname -s)-$(uname -m)" in
            Darwin-x86_64)                 t=taplo-darwin-x86_64; s=shfmt_v3.14.1_darwin_amd64 ;;
            Darwin-arm64)                  t=taplo-darwin-aarch64; s=shfmt_v3.14.1_darwin_arm64 ;;
            Linux-x86_64)                  t=taplo-linux-x86_64;  s=shfmt_v3.14.1_linux_amd64 ;;
            Linux-aarch64|Linux-arm64)     t=taplo-linux-aarch64; s=shfmt_v3.14.1_linux_arm64 ;;
            MINGW*-x86_64|MSYS*-x86_64|CYGWIN*-x86_64) t=taplo-windows-x86_64; s=shfmt_v3.14.1_windows_amd64.exe ;;
            MINGW*-aarch64|MSYS*-aarch64|CYGWIN*-aarch64|*arm64)   t=taplo-windows-aarch64; s=shfmt_v3.14.1_windows_amd64.exe ;;
            *) echo "unsupported platform: $(uname -s) $(uname -m)" >&2; exit 2 ;;
          esac
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/0.10.0/$t.gz" | gunzip > "$bin_dir/taplo"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.14.1/$s" -o "$bin_dir/shfmt"
          chmod +x "$bin_dir/taplo" "$bin_dir/shfmt"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Tool versions
        shell: bash
        run: |
          uv --version
          prettier --version
          taplo --version
          shfmt --version

      # Requires uv, bash, prettier, shfmt, and taplo (all installed above).
      # Exits non-zero when anything is unformatted.
      - name: Run formattington format check
        shell: bash
        run: ./ci/format_check.bash

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, labels: [self-hosted, macOS] }
          - { os: Windows, labels: [self-hosted, Windows] }
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # cache: false — the setup-go post-run cache step hangs on the
      # self-hosted runners; Go's own GOCACHE/module cache persists on disk.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go build ./...
