name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build cross-compiled binaries
        run: scripts/build.sh

      - name: Package archives
        run: |
          mkdir -p release
          for dir in dist/*/; do
            platform="$(basename "$dir")"
            if [[ "$platform" == windows-* ]]; then
              (cd "$dir" && zip -q "../../release/barnacle_${platform}.zip" barnacle.exe)
            else
              tar -czf "release/barnacle_${platform}.tar.gz" -C "$dir" barnacle
            fi
          done
          ls -lh release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
